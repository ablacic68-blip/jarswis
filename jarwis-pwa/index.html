<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E.G.O</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body, html {
            height: 100dvh;
            width: 100vw;
            background-color: #090d16;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        
        .header {
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .header-title { font-weight: 600; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 8px #38bdf8; }
        .new-btn { background: none; border: 1px solid rgba(255,255,255,0.15); color: #f1f5f9; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
        .user-msg { align-self: flex-end; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
        .bot-msg { align-self: flex-start; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: #e2e8f0; border-bottom-left-radius: 4px; }

        .input-bar { padding: 12px; background: #0f172a; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 8px; }
        input[type="text"] { flex: 1; height: 44px; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); padding: 0 14px; border-radius: 12px; color: white; font-size: 16px; outline: none; }
        .send-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; width: 44px; height: 44px; border-radius: 12px; color: white; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <div class="status-dot"></div>
                <span>E.G.O</span>
            </div>
            <button class="new-btn" onclick="clearChat()">Očisti Chat</button>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Napiši poruku E.G.O-u..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // OVDJE UNESI SVOJ GEMINI API KLJUČ:
        const API_KEY = "TVOJ_GEMINI_API_KEY_OVDJE"; 

        let messages = [];

        window.onload = function() {
            const saved = localStorage.getItem("ego_messages");
            if (saved) {
                messages = JSON.parse(saved);
            } else {
                messages = [{ sender: "bot", text: "E.G.O je aktivan. Slušam." }];
            }
            renderMessages();
        };

        function saveMessages() {
            localStorage.setItem("ego_messages", JSON.stringify(messages));
        }

        function clearChat() {
            messages = [{ sender: "bot", text: "E.G.O je ponovno pokrenut. Slušam." }];
            saveMessages();
            renderMessages();
        }

        function renderMessages() {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = "";

            messages.forEach(msg => {
                const div = document.createElement("div");
                div.className = `msg ${msg.sender === 'user' ? 'user-msg' : 'bot-msg'}`;
                div.textContent = msg.text;
                chatBox.appendChild(div);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            // Dodaj korisničku poruku
            messages.push({ sender: "user", text: text });
            saveMessages();
            renderMessages();
            input.value = "";

            // Prikaz "Razmišljam..."
            const loadingId = Date.now();
            messages.push({ sender: "bot", text: "E.G.O razmišlja...", id: loadingId });
            renderMessages();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "Tvoje ime je E.G.O. Odgovaraj direktno, inteligentno i bez suvišnog okolišanja na hrvatskom jeziku. Korisnikova poruka: " + text }]
                        }]
                    })
                });

                const data = await response.json();

                messages = messages.filter(m => m.id !== loadingId);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    messages.push({ sender: "bot", text: reply });
                } else {
                    messages.push({ sender: "bot", text: "E.G.O sustav: Nije moguće generirati odgovor. Provjeri API ključ." });
                }

            } catch (error) {
                messages = messages.filter(m => m.id !== loadingId);
                messages.push({ sender: "bot", text: "E.G.O sustav: Pogreška pri spajanju na poslužitelj." });
            }

            saveMessages();
            renderMessages();
        }
    </script>
</body>
</html>
