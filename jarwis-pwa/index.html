<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Website Generator - Agencija u kutiji</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #090d16; color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 400px; background: #0f172a; border-right: 1px solid rgba(255,255,255,0.08); padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .preview-area { flex: 1; background: #1e293b; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        h2 { font-size: 1.2rem; color: #38bdf8; margin-bottom: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
        input, textarea { background: #1e293b; border: 1px solid rgba(255,255,255,0.12); padding: 10px 14px; border-radius: 8px; color: white; font-size: 0.95rem; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        
        .gen-btn { background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; color: white; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .gen-btn:hover { opacity: 0.9; }

        /* Prikaz unutar okvira mobitela */
        .phone-frame {
            width: 380px;
            height: 750px;
            background: #000;
            border: 10px solid #334155;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        .export-btn { background: #10b981; border: none; color: white; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚡ AI Generator Web Stranica</h2>
        <p style="font-size: 0.85rem; color: #94a3b8;">Upiši podatke o klijentu i generiraj demo u sekundi.</p>
        
        <div class="form-group">
            <label>Naziv biznisa</label>
            <input type="text" id="bizName" value="Frizerski Salon 'Stil'" placeholder="Npr. Restoran Bepo">
        </div>

        <div class="form-group">
            <label>Djelatnost / Niche</label>
            <input type="text" id="bizNiche" value="Vrhunske muške i ženske frizure" placeholder="Npr. Tradicionalna dalmatinska konoba">
        </div>

        <div class="form-group">
            <label>Grad / Lokacija</label>
            <input type="text" id="bizCity" value="Šibenik" placeholder="Npr. Šibenik">
        </div>

        <div class="form-group">
            <label>Telefon za kontakt</label>
            <input type="text" id="bizPhone" value="+385 91 234 5678">
        </div>

        <div class="form-group">
            <label>Glavna ponuda / Usluge (odvojeno zarezom)</label>
            <textarea id="bizServices" rows="3">Moderno šišanje,Brijanje brade,Pramenovi i bojanje,Svečane frizure</textarea>
        </div>

        <button class="gen-btn" onclick="generateWebsite()">🚀 Generiraj Web Stranicu</button>
        <button class="export-btn" onclick="downloadCode()">💾 Preuzmi HTML Kod</button>
    </div>

    <div class="preview-area">
        <div class="phone-frame">
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <script>
        let generatedHtml = "";

        function generateWebsite() {
            const name = document.getElementById("bizName").value;
            const niche = document.getElementById("bizNiche").value;
            const city = document.getElementById("bizCity").value;
            const phone = document.getElementById("bizPhone").value;
            const servicesRaw = document.getElementById("bizServices").value;
            
            const servicesArray = servicesRaw.split(",").map(s => `
                <div style="background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); padding: 15px; border-radius: 12px; margin-bottom: 10px;">
                    <h3 style="color: #38bdf8; font-size: 1rem; margin-bottom: 4px;">✔ ${s.trim()}</h3>
                    <p style="font-size: 0.8rem; color: #94a3b8;">Vrhunska usluga prilagođena vašim željama uz profesionalnu opremu.</p>
                </div>
            `).join("");

            generatedHtml = `<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${name} - ${city}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f1f5f9; line-height: 1.5; }
        header { background: linear-gradient(135deg, #0284c7, #2563eb); padding: 40px 20px; text-align: center; }
        header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; color: white; }
        header p { font-size: 0.95rem; color: #e0f2fe; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .section-title { font-size: 1.2rem; font-weight: 700; margin: 20px 0 10px 0; color: #38bdf8; border-left: 4px solid #38bdf8; padding-left: 10px; }
        .cta-btn { display: block; width: 100%; background: #22c55e; color: white; text-align: center; padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 1.1rem; margin-top: 25px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 30px; }
    </style>
</head>
<body>
    <header>
        <h1>${name}</h1>
        <p>${niche} u gradu ${city}</p>
    </header>
    <div class="container">
        <div class="section-title">Naše Usluge</div>
        ${servicesArray}
        
        <div class="section-title">Kontaktirajte nas</div>
        <p style="margin-bottom: 10px; font-size: 0.9rem;">Nalazimo se u ${city}-u. Nazovite nas i rezervirajte svoj termin na vrijeme.</p>
        
        <a href="tel:${phone}" class="cta-btn">📞 Nazovite odmah: ${phone}</a>
    </div>
    <footer>
        &copy; ${new Date().getFullYear()} ${name}. Sva prava pridržana.
    </footer>
</body>
</html>`;

            // Prikaz u iframe-u unutar "mobitela"
            const iframe = document.getElementById("previewFrame");
            iframe.srcdoc = generatedHtml;
        }

        function downloadCode() {
            if (!generatedHtml) {
                alert("Prvo generiraj stranicu!");
                return;
            }
            const blob = new Blob([generatedHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "index.html";
            a.click();
            URL.revokeObjectURL(url);
        }

        // Automatsko generiranje na pokretanje
        window.onload = generateWebsite;
    </script>
</body>
</html>
