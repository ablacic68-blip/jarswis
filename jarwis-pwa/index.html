<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
        .chat-header { background: #0f172a; padding: 15px 20px; border-bottom: 1px solid #334155; text-align: center; font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #0284c7; color: white; align-self: flex-end; }
        .bot-message { background: #334155; color: #f1f5f9; align-self: flex-start; }
        .chat-input-area { display: flex; padding: 15px; background: #0f172a; gap: 10px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        button { padding: 12px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">J.A.R.V.I.S. AI</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Bok! Ja sam JARVIS. Kako ti mogu pomoći danas?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Upiši poruku..." onkeydown="if(event.key==='Enter') posaljiPoruku()">
        <button onclick="posaljiPoruku()">Pošalji</button>
    </div>
</div>

<script>
async function posaljiPoruku() {
    const input = document.getElementById("userInput");
    const container = document.getElementById("chatMessages");
    const tekst = input.value.trim();

    if (!tekst) return;

    // Prikazi poruku korisnika
    container.innerHTML += `<div class="message user-message">${tekst}</div>`;
    input.value = "";
    container.scrollTop = container.scrollHeight;

    // Prikazi status ucitavanja
    const tempBotMsg = document.createElement("div");
    tempBotMsg.className = "message bot-message";
    tempBotMsg.innerText = "JARVIS razmišlja...";
    container.appendChild(tempBotMsg);
    container.scrollTop = container.scrollHeight;

    try {
        const response = await fetch("https://jarswis.onrender.com/api/jarvis", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: tekst })
        });

        const data = await response.json();
        tempBotMsg.innerText = data.reply || "Nema odgovora.";
    } catch (error) {
        tempBotMsg.innerText = "Greška pri spajanju na poslužitelj.";
        tempBotMsg.style.color = "#ef4444";
    }
    
    container.scrollTop = container.scrollHeight;
}
</script>
// Izmjeni fetch poziv da izgleda ovako:

    method: 'POST',

    body: JSON.stringify({ text: userMessage })

</body>
</html>
