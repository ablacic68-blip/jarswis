<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 30px 20px;
    }
    header { text-align: center; }
    h1 { color: #38bdf8; font-size: 28px; letter-spacing: 2px; }
    
    .content {
      width: 100%;
      max-width: 500px;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #status { color: #94a3b8; font-size: 16px; margin-bottom: 20px; }
    #response {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      font-size: 18px;
      line-height: 1.5;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      margin-bottom: 20px;
    }

    .controls { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      width: 100%; 
      max-width: 500px; 
      gap: 15px; 
    }
    
    .text-box {
      display: flex;
      width: 100%;
      gap: 10px;
    }
    
    .text-box input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .text-box input:focus {
      border-color: #38bdf8;
    }
    
    .text-box button {
      padding: 14px 22px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .text-box button:hover {
      background: #0369a1;
    }

    .mic-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(2, 132, 199, 0.4);
      transition: transform 0.2s;
    }
    .mic-btn:active { transform: scale(0.95); }
    .listening { animation: pulse 1.5s infinite; background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S.</h1>
  </header>

  <div class="content">
    <div id="status">Upišite poruku ili pritisnite mikrofon...</div>
    <div id="response">Spreman za rad.</div>
  </div>

  <div class="controls">
    <!-- Primary Option: Text Input -->
    <div class="text-box">
      <input type="text" id="userInput" placeholder="Napiši poruku JARVIS-u..." onkeydown="if(event.key==='Enter') sendText()">
      <button onclick="sendText()">Pošalji</button>
    </div>
    
    <!-- Secondary Option: Voice Input -->
    <button id="micBtn" class="mic-btn" onclick="toggleListening()" title="Glasovni unos">🎙️</button>
  </div>

  <script>
    const BACKEND_URL = "https://jarswis.onrender.com/api/jarvis";

    async function sendText() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await processRequest(text);
    }

    async function processRequest(text) {
      document.getElementById('status').innerText = `Šaljem: "${text}"`;
      document.getElementById('response').innerText = "JARVIS razmišlja...";

      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        
        const data = await res.json();
        document.getElementById('response').innerText = data.reply;
        document.getElementById('status').innerText = `Model: ${data.model_used || 'Spreman'}`;

        speakResponse(data.reply);
      } catch (err) {
        document.getElementById('response').innerText = "Pogreška pri spajanju na server.";
        document.getElementById('status').innerText = "Provjerite je li Render aktiviran.";
      }
    }

    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'hr-HR';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('status').innerText = "Slušam vas...";
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        processRequest(text);
      };
    }

    function toggleListening() {
      if (!recognition) return alert("Glasovni unos nije podržan u ovom pregledniku.");
      isListening ? recognition.stop() : recognition.start();
    }

    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hr-HR';
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
