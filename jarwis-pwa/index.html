<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JARVIS Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #090d16;
            color: #f1f5f9;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1rem; }
        .status-dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 8px #38bdf8; }
        .tts-toggle { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .tts-toggle.active { color: #38bdf8; border-color: #38bdf8; }
        
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }
        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }
        .chat-img { max-width: 100%; max-height: 220px; border-radius: 12px; margin-bottom: 6px; display: block; }
        
        .preview-area {
            display: none;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            align-items: center;
            gap: 10px;
        }
        .preview-area img { height: 44px; border-radius: 8px; }
        .preview-area button { background: #ef4444; border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }

        .input-bar {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btns { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .icon-btn.recording { background: #ef4444; border-color: #f87171; animation: pulse 1s infinite; }
        input[type="text"] {
            flex: 1;
            height: 44px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0 14px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .send-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <div class="status-dot"></div>
            <span>JARVIS Mobile</span>
        </div>
        <button class="tts-toggle active" id="ttsToggle" onclick="toggleTTS()">🔊 Glas uključena</button>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg bot-msg">Bok! Možeš mi pisati, pričati na mikrofon ili poslati sliku iz galerije/kamere.</div>
    </div>

    <div class="preview-area" id="previewArea">
        <img id="imgPreview" src="" alt="Preview">
        <span style="font-size: 0.85rem; flex:1; color:#94a3b8;">Slika spremana</span>
        <button onclick="clearImage()">✕</button>
    </div>

    <div class="input-bar">
        <!-- Skriveni ulazi za kameru i galeriju -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFileSelect(event)">
        <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

        <div class="action-btns">
            <button class="icon-btn" onclick="document.getElementById('cameraInput').click()" title="Slikaj">📷</button>
            <button class="icon-btn" onclick="document.getElementById('galleryInput').click()" title="Galerija">🖼️</button>
            <button class="icon-btn" id="micBtn" onclick="toggleSpeech()" title="Govori">🎙️</button>
            <input type="text" id="userInput" placeholder="Poruka ili glas..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let selectedBase64 = null;
        let selectedMime = "image/jpeg";
        let ttsEnabled = true;
        let recognition = null;
        let isRecording = false;

        // Postavke za prepoznavanje govora (Speech-to-Text)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hr-HR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById("userInput").value = transcript;
                stopSpeech();
                sendMessage();
            };

            recognition.onerror = () => stopSpeech();
            recognition.onend = () => stopSpeech();
        }

        function toggleSpeech() {
            if (!recognition) {
                alert("Vaš preglednik ne podržava glasovni unos.");
                return;
            }
            if (isRecording) {
                stopSpeech();
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById("micBtn").classList.add("recording");
            }
        }

        function stopSpeech() {
            isRecording = false;
            document.getElementById("micBtn").classList.remove("recording");
            if (recognition) recognition.stop();
        }

        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById("ttsToggle");
            btn.classList.toggle("active", ttsEnabled);
            btn.textContent = ttsEnabled ? "🔊 Glas uključena" : "🔇 Glas isključena";
            if (!ttsEnabled) window.speechSynthesis.cancel();
        }

        function speak(text) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hr-HR';
            window.speechSynthesis.speak(utterance);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedMime = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64 = e.target.result;
                document.getElementById("imgPreview").src = selectedBase64;
                document.getElementById("previewArea").style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            selectedBase64 = null;
            document.getElementById("cameraInput").value = "";
            document.getElementById("galleryInput").value = "";
            document.getElementById("previewArea").style.display = "none";
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const text = input.value.trim();

            if (!text && !selectedBase64) return;

            const userDiv = document.createElement("div");
            userDiv.className = "msg user-msg";
            
            if (selectedBase64) {
                const imgEl = document.createElement("img");
                imgEl.src = selectedBase64;
                imgEl.className = "chat-img";
                userDiv.appendChild(imgEl);
            }
            if (text) {
                userDiv.appendChild(document.createTextNode(text));
            }

            chatBox.appendChild(userDiv);
            
            const payloadData = {
                text: text,
                image: selectedBase64,
                mime_type: selectedMime
            };

            input.value = "";
            clearImage();
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement("div");
            loadingDiv.className = "msg bot-msg";
            loadingDiv.textContent = "JARVIS razmišlja...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("/api/jarvis", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payloadData)
                });

                const data = await res.json();
                const replyText = data.reply || "Nema odgovora.";
                loadingDiv.textContent = replyText;
                speak(replyText);
            } catch (err) {
                loadingDiv.textContent = "Greška u povezivanju s poslužiteljem.";
                loadingDiv.style.color = "#ef4444";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
