<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            height: 94vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .header {
            padding: 18px 20px;
            background: rgba(2, 6, 23, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .status-dot { width: 9px; height: 9px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg {
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease-in-out;
        }
        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }
        .chat-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: block;
        }
        .preview-area {
            display: none;
            padding: 8px 16px;
            background: rgba(2, 6, 23, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            align-items: center;
            gap: 10px;
        }
        .preview-area img { height: 50px; border-radius: 6px; }
        .preview-area button { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .input-area {
            padding: 14px;
            background: rgba(2, 6, 23, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        .icon-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="status-dot"></div>
            <span>JARVIS AI Vision</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot-msg">Bok! Pošalji mi tekst ili sliku zadatka pa ću ti ga riješiti i objasniti.</div>
        </div>

        <div class="preview-area" id="previewArea">
            <img id="imgPreview" src="" alt="Preview">
            <span style="font-size: 0.85rem; flex:1;">Slika pripremljena</span>
            <button onclick="clearImage()">✕</button>
        </div>

        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Učitaj ili slikaj">📷</button>
            <input type="text" id="userInput" placeholder="Napiši poruku ili uputu uz sliku..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">Pošalji</button>
        </div>
    </div>

    <script>
        let selectedBase64 = null;
        let selectedMime = "image/jpeg";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedMime = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64 = e.target.result;
                document.getElementById("imgPreview").src = selectedBase64;
                document.getElementById("previewArea").style.display = "flex";
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            selectedBase64 = null;
            document.getElementById("fileInput").value = "";
            document.getElementById("previewArea").style.display = "none";
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const text = input.value.trim();

            if (!text && !selectedBase64) return;

            const userDiv = document.createElement("div");
            userDiv.className = "msg user-msg";
            
            if (selectedBase64) {
                const imgEl = document.createElement("img");
                imgEl.src = selectedBase64;
                imgEl.className = "chat-img";
                userDiv.appendChild(imgEl);
            }
            if (text) {
                const textNode = document.createTextNode(text);
                userDiv.appendChild(textNode);
            }

            chatBox.appendChild(userDiv);
            
            const payloadData = {
                text: text,
                image: selectedBase64,
                mime_type: selectedMime
            };

            input.value = "";
            clearImage();
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement("div");
            loadingDiv.className = "msg bot-msg";
            loadingDiv.textContent = "JARVIS analizira i rješava...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch("/api/jarvis", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payloadData)
                });

                const data = await res.json();
                loadingDiv.textContent = data.reply || "Nema odgovora.";
            } catch (err) {
                loadingDiv.textContent = "Greška: Nije moguće uspostaviti vezu sa poslužiteljem.";
                loadingDiv.style.color = "#ef4444";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
