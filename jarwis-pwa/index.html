<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .user-msg { color: #4da6ff; text-align: right; margin: 8px 0; }
        .bot-msg { color: #00ff88; text-align: left; margin: 8px 0; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 12px 20px; border-radius: 6px; border: none; background: #007bff; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <h2>JARVIS AI Assistant</h2>
    <div id="chat-box"></div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="Upiši poruku..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Pošalji</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chat-box");
            const text = inputField.value.trim();

            if (!text) return;

            // Prikaz korisničke poruke
            chatBox.innerHTML += `<div class="user-msg"><b>Ti:</b> ${text}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Poziv prema Python backendu
                const response = await fetch("/api/jarvis", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                
                // Prikaz odgovora iz data.reply
                chatBox.innerHTML += `<div class="bot-msg"><b>JARVIS:</b> ${data.reply}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;"><b>Greška:</b> Nije moguće spojiti se na server.</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
